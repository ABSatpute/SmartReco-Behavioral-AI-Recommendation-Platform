databases:
  - name: smartreco-db
    plan: free

services:
  - type: web
    name: smartreco
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartreco-db
          property: connectionString
      - key: MESH_API_KEY
        sync: false
      - key: MESH_BASE_URL
        value: https://api.meshapi.ai/v1
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: smartreco
      - key: NOTIFICATION_CHANNELS
        value: email,telegram
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ab31satpute@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: ab31satpute@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SESSION_GAP_MINUTES
        value: "30"
      - key: SESSION_SLOTS_HOURS
        value: "1,6,12"
      - key: LANGSMITH_API_KEY
        sync: false
