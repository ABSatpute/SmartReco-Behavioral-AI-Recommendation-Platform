services:
  db:
    image: postgres:16-alpine
    container_name: smartreco-db
    environment:
      POSTGRES_USER: smartreco
      POSTGRES_PASSWORD: smartreco
      POSTGRES_DB: smartreco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartreco"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
